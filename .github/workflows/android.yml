name: Android 16 APK

# 在 GitHub 网页上手动触发（Actions → Android 16 APK → Run workflow），
# 或推送 android-* 标签自动构建并发布 Release。
# 公开仓库 Actions 分钟数不限；私有仓库每月 2000 分钟（首次全套约 60–120 分钟）。
on:
  workflow_dispatch:
  push:
    tags: ["android-*"]

# 发布 Release 需要写 contents 权限（新仓库默认是只读）
permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_API: "36"   # Android 16
  MIN_API: "28"      # Qt 6.11 for Android 要求的最低 API
  # NDK r28 起默认按 16 KB 页对齐编译；Android 16 设备（如 iQOO 15）可能用 16 KB 页，
  # 用 r27 编出来的 4 KB 对齐 .so 会在 dlopen 时失败，表现为黑屏闪退。
  NDK_VERSION: "28c"

jobs:
  build:
    # 交叉编译 PySide6 Android 轮子需要 Linux 主机，GitHub 免费 runner 正好是 Ubuntu
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      # runner 默认 JAVA_HOME 指向 JDK 11，而新版 sdkmanager 需要 17
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖（编译工具 + JDK 17）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl unzip zip \
            libssl-dev libffi-dev libncurses5-dev libtinfo5 \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            autoconf automake libtool bzip2 xz-utils zlib1g-dev \
            liblzma-dev libbz2-dev libsqlite3-dev libreadline-dev \
            libgdbm-dev libnss3-dev libffi-dev \
            clang-14 llvm-14-dev libclang-14-dev libclang1-14 libclang-cpp14 \
            openjdk-17-jdk
          sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          java -version
          # shiboken 用 libclang 解析头文件；NDK 的 libc++ 头需要新 clang 才能读懂
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm18.list
          sudo apt-get update
          sudo apt-get install -y libclang-18-dev llvm-18-dev clang-18
          ls /usr/lib/llvm-18/lib/cmake/clang

      - name: 缓存 Qt for Android
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-android-${{ runner.os }}-6.11.1

      - name: 安装 Qt for Android 6.11.1（与桌面 PySide6 版本一致）
        run: |
          python3 -m pip install --upgrade pip aqtinstall
          if [ ! -d "$HOME/Qt/6.11.1/android_arm64_v8a" ]; then
            # 参数顺序：install-qt <host> <target> <version> <arch>
            python3 -m aqt install-qt linux android 6.11.1 android_arm64_v8a -O "$HOME/Qt"
          fi
          if [ ! -d "$HOME/Qt/6.11.1/gcc_64" ]; then
            # Android 包里只有目标库，交叉编译要用的主机工具（moc/rcc 等）在桌面版里
            python3 -m aqt install-qt linux desktop 6.11.1 linux_gcc_64 -O "$HOME/Qt"
          fi
          ls "$HOME/Qt/6.11.1"
          ls "$HOME/Qt/6.11.1/gcc_64/bin" | head -5

      - name: 预装新版 Android 命令行工具 + API 36 平台
        shell: bash
        run: |
          # 交叉编译脚本默认下 2021 年的 sdkmanager，它在 JDK 17 上会抛
          # NoClassDefFoundError: javax/xml/bind/annotation/XmlSchema
          # 这里先放一份新版进去，脚本检测到就会直接用
          export PATH="$JAVA_HOME/bin:$PATH"
          SDK="$HOME/.pyside6_android_deploy/android-sdk"
          mkdir -p "$SDK"
          if [ ! -x "$SDK/tools/bin/sdkmanager" ]; then
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d "$SDK"
            if [ -d "$SDK/cmdline-tools/bin" ]; then
              mv "$SDK/cmdline-tools" "$SDK/tools"
            elif [ -d "$SDK/cmdline-tools/latest" ]; then
              mv "$SDK/cmdline-tools/latest" "$SDK/tools"
            fi
          fi
          yes | "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          # Android 16 的编译平台与 build-tools
          "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-$TARGET_API" "build-tools;36.0.0" "platform-tools"
          "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" --version || true
          java -version

      - name: 准备 Python 3.11（CPython 交叉编译要求 build-python 版本一致）
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存 NDK / SDK / 已经编好的轮子
        uses: actions/cache@v4
        with:
          path: |
            ~/.pyside6_android_deploy
            .android-wheels
          key: pyside-android-api36-16kb2-${{ runner.os }}-6.11.1

      - name: 缓存 Gradle（buildozer 打包时使用）
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-android-${{ runner.os }}-${{ hashFiles('.github/workflows/android.yml') }}

      - name: 交叉编译 PySide6 / shiboken6 的 Android 轮子
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee cross.log) 2>&1
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          export LLVM_INSTALL_DIR=/usr/lib/llvm-18
          export CLANG_INSTALL_DIR=/usr/lib/llvm-18
          export CMAKE_PREFIX_PATH=/usr/lib/llvm-18
          java -version
          python3 --version
          ls /usr/lib/llvm-18/lib/libclang.so*
          # 轮子统一放在工作区的 .android-wheels，和 pyside-setup 源码分开缓存：
          # 之前把 pyside-setup/dist 整个缓存回来会在工作区造出一个 pyside-setup 目录，
          # 下一步 git clone 直接 128 失败，而且它还会被打进 APK 当源码扫描。
          WHEELS="$GITHUB_WORKSPACE/.android-wheels"
          mkdir -p "$WHEELS"
          if ls "$WHEELS"/pyside6-*.whl "$WHEELS"/shiboken6-*.whl >/dev/null 2>&1; then
            echo "缓存里已有轮子，跳过编译"
            ls -lh "$WHEELS"
            exit 0
          fi
          # pyside-setup 必须克隆在工作区之外，否则 buildozer 会把整个源码树复制进 APK
          BUILD="$RUNNER_TEMP/pyside-build"
          rm -rf "$BUILD"
          mkdir -p "$BUILD"
          cd "$BUILD"
          git clone --depth 1 --branch 6.11.1 https://code.qt.io/pyside/pyside-setup.git
          cd pyside-setup
          # 注意：PySide6 轮子仍用 6.11.1 默认的 NDK r27c。换成 r28c 后 shiboken 的
          # ApiExtractor 在解析 Qt 头文件时会失败（r28 的 libc++ 引用
          # pthread_cond_clockwait，而 libclang 用的 target triple 不带 API level）。
          # 16 KB 页对齐改为显式加链接参数 -Wl,-z,max-page-size=16384 实现。
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/cross_compile_android/templates/toolchain_default.tmpl.cmake")
          s = p.read_text()
          old = 'set(QT_LINKER_FLAGS "-Wl,-O1'
          assert old in s, "QT_LINKER_FLAGS not found in toolchain template"
          if "max-page-size=16384" not in s:
              s = s.replace(old, 'set(QT_LINKER_FLAGS "-Wl,-z,max-page-size=16384 -Wl,-O1', 1)
              p.write_text(s)
          print([l for l in s.splitlines() if "QT_LINKER_FLAGS" in l][:1])
          PY
          # 6.11.1 的 toolchain 模板漏了 QT_HOST_PATH，交叉编译 Qt6 会报
          # "please set the QT_HOST_PATH cache variable to the location of your host Qt"
          sed -i 's|^set(CMAKE_SYSTEM_NAME Android)$|set(CMAKE_SYSTEM_NAME Android)\nset(QT_HOST_PATH "{{ qt_install_path }}/gcc_64" CACHE PATH "")|' \
            tools/cross_compile_android/templates/toolchain_default.tmpl.cmake
          grep -n "QT_HOST_PATH" tools/cross_compile_android/templates/toolchain_default.tmpl.cmake
          # 只编我们真正用到的模块（QtQuick 的 shiboken 解析在 NDK 头文件上会崩）
          sed -i 's|"--no-qt-tools"\]|"--no-qt-tools", "--module-subset=QtCore,QtGui,QtWidgets,QtTest"]|' \
            tools/cross_compile_android/main.py
          grep -n "module-subset" tools/cross_compile_android/main.py
          # 缓存里可能留着旧版生成的 toolchain，删掉让它按新模板重写
          rm -f "$HOME/.pyside6_android_deploy/toolchain_aarch64.cmake"
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r tools/cross_compile_android/requirements.txt
          python3 tools/cross_compile_android/main.py \
            --plat-name=aarch64 \
            --qt-install-path="$HOME/Qt/6.11.1" \
            --auto-accept-license --skip-update --verbose
          # 只把 .whl 拷出来，源码树留在 $RUNNER_TEMP，不污染仓库
          for f in dist/*.whl dist_android/*.whl; do
            [ -e "$f" ] && cp -v "$f" "$WHEELS"/
          done
          ls -lh "$WHEELS"
          ls "$WHEELS"/*.whl >/dev/null 2>&1

      - name: 确保 Android NDK r28c（16 KB 页对齐）
        shell: bash
        run: |
          NDK_DIR="$HOME/.pyside6_android_deploy/android-ndk"
          NDK="$NDK_DIR/android-ndk-r$NDK_VERSION"
          if [ ! -d "$NDK" ]; then
            mkdir -p "$NDK_DIR"
            curl -fsSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-r${NDK_VERSION}-linux.zip"
            unzip -q /tmp/ndk.zip -d "$NDK_DIR"
            rm -f /tmp/ndk.zip
          fi
          ls "$NDK" | head
          cat "$NDK/source.properties" | head -5

      - name: 失败时打印交叉编译日志尾部
        if: failure()
        shell: bash
        run: |
          echo "==================== cross.log (tail 150) ===================="
          tail -n 150 cross.log || true
          echo "==================== Qt 目录 ===================="
          ls "$HOME/Qt/6.11.1" || true

      - name: 安装部署工具
        shell: bash
        run: |
          python3 -m pip install "pyside6==6.11.1" buildozer cython
          # pyside6-android-deploy 自己会检查这份依赖（pkginfo 等）
          REQ=$(python3 -c "import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), 'scripts', 'requirements-android.txt'))")
          echo "requirements: $REQ"
          cat "$REQ"
          python3 -m pip install -r "$REQ"

      - name: 打 Android 16 APK（targetSdk 36 / minSdk 28）
        shell: bash
        run: |
          set -o pipefail
          export PATH="$JAVA_HOME/bin:$PATH"
          # wheel 文件名是全小写（pyside6-...whl / shiboken6-...whl），用 -iname 找
          WHEELS="$GITHUB_WORKSPACE/.android-wheels"
          PS=$(find "$WHEELS" -maxdepth 1 -iname 'pyside6-*.whl' | head -1)
          SH=$(find "$WHEELS" -maxdepth 1 -iname 'shiboken6-*.whl' | head -1)
          echo "PySide6 wheel: $PS"
          echo "shiboken6 wheel: $SH"
          if [ -z "$PS" ] || [ -z "$SH" ]; then
            echo "找不到 Android 轮子："
            ls -lh "$WHEELS" || true
            exit 1
          fi
          # 只把运行必需的文件放进干净的暂存目录再部署。
          # buildozer 会把当前目录整棵树复制进 APK 并 compileall：
          # pyside-setup（Jinja 模板 .py）、docs/design、app/shots 都会直接炸掉打包。
          STAGE="$RUNNER_TEMP/appsrc"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/app/pages"
          cp -v main.py "$STAGE/"
          cp -v app/*.py "$STAGE/app/"
          cp -v app/pages/*.py "$STAGE/app/pages/"
          cd "$STAGE"
          # 用包装器把 buildozer.spec 的 android.api/minapi 改成 Android 16 的要求
          # --ndk-path 指向 r28c：p4a 用它编译 CPython/openssl/sqlite 等，保证 16 KB 对齐
          python3 "$GITHUB_WORKSPACE/scripts/android16_deploy.py" \
            --name FrogLog \
            --wheel-pyside "$PS" \
            --wheel-shiboken "$SH" \
            --ndk-path "$HOME/.pyside6_android_deploy/android-ndk/android-ndk-r$NDK_VERSION" \
            --keep-deployment-files \
            --force \
            -v 2>&1 | tee "$GITHUB_WORKSPACE/deploy.log"
          # 打印关键配置，方便确认 p4a 用的是我们预置的源码（而不是官方 3.14 分支）
          echo "=== buildozer.spec 关键配置 ==="
          grep -nE '^(android\.(api|minapi|ndk)|p4a\.(source_dir|branch|commit))' "$STAGE/buildozer.spec" || true
          echo "=== buildozer 是否又去 clone 官方 p4a（应为 0）==="
          grep -c "Cloning into 'python-for-android'" "$GITHUB_WORKSPACE/deploy.log" || true
          # pyside6-android-deploy 会把异常吞掉、照样退出 0，所以按产物判断成败
          mkdir -p "$GITHUB_WORKSPACE/out"
          FOUND=0
          while IFS= read -r f; do
            cp -v "$f" "$GITHUB_WORKSPACE/out/"
            FOUND=1
          done < <(find "$STAGE" -type f -name '*.apk' 2>/dev/null)
          echo "=== 产物 ==="
          ls -lh "$GITHUB_WORKSPACE/out" || true
          if [ "$FOUND" -eq 0 ]; then
            echo "没有生成 APK，deploy.log 最后 200 行："
            tail -n 200 "$GITHUB_WORKSPACE/deploy.log" || true
            exit 1
          fi

      - name: 打最小 Qt 示例 APK（区分打包问题还是应用问题）
        shell: bash
        run: |
          WHEELS="$GITHUB_WORKSPACE/.android-wheels"
          PS=$(find "$WHEELS" -maxdepth 1 -iname 'pyside6-*.whl' | head -1)
          SH=$(find "$WHEELS" -maxdepth 1 -iname 'shiboken6-*.whl' | head -1)
          STAGE2="$RUNNER_TEMP/hellosrc"
          rm -rf "$STAGE2"
          mkdir -p "$STAGE2"
          cp -v scripts/hello_android.py "$STAGE2/main.py"
          cd "$STAGE2"
          python3 "$GITHUB_WORKSPACE/scripts/android16_deploy.py" \
            --name HelloQt \
            --wheel-pyside "$PS" \
            --wheel-shiboken "$SH" \
            --ndk-path "$HOME/.pyside6_android_deploy/android-ndk/android-ndk-r$NDK_VERSION" \
            --force \
            -v 2>&1 | tee "$GITHUB_WORKSPACE/deploy-hello.log"
          find "$STAGE2" -type f -name '*.apk' -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: 校验 APK 的 Android 版本并重命名
        shell: bash
        run: |
          APK=$(find out -maxdepth 1 -name 'FrogLog*.apk' | head -1)
          echo "APK: $APK"
          AAPT2=$(find "$HOME/.pyside6_android_deploy/android-sdk/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          echo "aapt2: $AAPT2"
          BADGING=$("$AAPT2" dump badging "$APK")
          echo "$BADGING" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^application-label"
          TARGET=$(echo "$BADGING" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'/\1/p")
          MINSDK=$(echo "$BADGING" | sed -n "s/^sdkVersion:'\([0-9]*\)'/\1/p")
          echo "targetSdk=$TARGET minSdk=$MINSDK"
          if [ "$TARGET" != "36" ]; then
            echo "::error::targetSdk 不是 36（Android 16），实际为 $TARGET"
            exit 1
          fi
          # Android 16 设备可能用 16 KB 页：native 库的 LOAD 段必须 16 KB 对齐，
          # 否则 dlopen 失败，表现就是打开黑屏后闪退（iQOO 15 等新机）
          TMP=$(mktemp -d)
          unzip -q -o "$APK" 'lib/arm64-v8a/*' -d "$TMP"
          BAD=0
          for f in "$TMP"/lib/arm64-v8a/*; do
            [ -f "$f" ] || continue
            # lib/ 下不全是 ELF：p4a 的 libpybundle.so 其实是打包成 .so 的 zip
            if ! readelf -h "$f" >/dev/null 2>&1; then
              echo "跳过非 ELF 文件：$(basename "$f")"
              continue
            fi
            ALIGN=$(readelf -lW "$f" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
            echo "$(basename "$f"): LOAD 对齐 $ALIGN"
            case "$ALIGN" in
              *0x1000*)
                echo "::error::$(basename "$f") 的 LOAD 段是 4 KB 对齐（$ALIGN），不支持 16 KB 页"
                BAD=1
                ;;
            esac
          done
          # PySide6 轮子里的 .so 必须能找到它 NEEDED 的 libpython。
          # 之前就是轮子链接 libpython3.11.so、APK 里只有 libpython3.14.so，
          # import PySide6 时 dlopen 失败，打开即闪退。
          python3 - "$TMP" <<'PYCHECK' || exit 1
          import os, re, subprocess, sys
          libdir = os.path.join(sys.argv[1], 'lib', 'arm64-v8a')
          files = sorted(f for f in os.listdir(libdir) if f.endswith('.so'))
          have = set(files)
          bad = []
          for f in files:
              p = os.path.join(libdir, f)
              if subprocess.run(['readelf', '-h', p], capture_output=True).returncode != 0:
                  continue  # libpybundle.so 是打成 .so 的压缩包
              out = subprocess.run(['readelf', '-d', p], capture_output=True, text=True).stdout
              for dep in re.findall(r'Shared library: \[(libpython3\.\d+\.so)\]', out):
                  if dep not in have:
                      bad.append('{} 需要 {}，但 APK 里没有'.format(f, dep))
          print('libpython 依赖闭环检查：' + ('通过' if not bad else '失败'))
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          PYCHECK
          rm -rf "$TMP"
          if [ "$BAD" -ne 0 ]; then
            exit 1
          fi
          echo "16 KB 页对齐检查通过"
          # 启动诊断标记必须真的打进 dex（FrogLogDiagApp 被编译）
          if ! unzip -p "$APK" 'classes*.dex' | strings | grep -q 'froglog-android.txt'; then
            echo "::error::启动诊断标记没有打进 APK（FrogLogDiagApp 未被编译）"
            exit 1
          fi
          echo "启动诊断标记检查通过"
          mkdir -p dist
          cp "$APK" "dist/FrogLog-Android16-API36-${GITHUB_RUN_NUMBER}.apk"
          HELLO=$(find out -maxdepth 1 -name 'HelloQt*.apk' | head -1 || true)
          if [ -n "$HELLO" ]; then
            cp "$HELLO" "dist/HelloQt-Android16-API36-${GITHUB_RUN_NUMBER}.apk"
          fi
          ls -lh dist

      - name: 上传 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrogLog-android16-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传部署日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy.log
          if-no-files-found: warn
          retention-days: 30

      - name: 计算 Release 标签
        id: rel
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=android16-api36-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: FrogLog · 蛙记 — Android 16 版 (API 36)
          body: |
            自动构建的 Android 16 APK。

            - `targetSdkVersion` / `compileSdkVersion`：36（Android 16）
            - `minSdkVersion`：28（Android 9）
            - 架构：arm64-v8a
            - native 库按 **16 KB 页**对齐（NDK r28c），可用于 16 KB 页的 Android 16 设备
            - 构建方式：Qt 6.11.1 Open Source + PySide6 源码交叉编译（LGPL）
            - 提交：${{ github.sha }}
            - 运行：${{ github.run_number }}

            - 这是 debug 签名的 APK，可直接侧载安装；首次安装需允许「安装未知来源应用」。

            ## 本次修复了什么

            上一版**打开即闪退**的根因：PySide6 的 Android 轮子是按 CPython 3.11 编译的，
            扩展模块依赖 `libpython3.11.so`；而 python-for-android 的新版默认编出的是
            `libpython3.14.so`。所以一执行 `import PySide6` 就 dlopen 失败，进程直接退出，
            界面上什么都看不到。本版把 p4a 的 `python3` / `hostpython3` 钉回 3.11.11，
            与轮子对齐；CI 里也加了「libpython 依赖闭环」检查，以后再错会直接构建失败。

            ## 如果还是闪退：日志在「下载/FrogLog」里（不用进 Android/data）

            1. 安装 `FrogLog-*.apk`，点开一次（即使闪退）；
            2. **再点开一次**，保持 5 秒（第一次的日志会在第二次启动时同步出来）；
            3. 打开手机「文件管理 → 下载 → FrogLog」，
               把里面的 `froglog-android.txt`（以及 `froglog.log` / `froglog_crash.log`，如果有）发出来。

            这个文件记录启动阶梯，按最后一行就能定位崩溃位置：
            - 没有 `Application.attachBaseContext` → 崩在 Application 类加载 / native 库；
            - 有 `Application.onCreate`、没有 `QtApplication.super.onCreate 已返回` → 崩在 Qt 初始化；
            - 有 `PythonActivity.onCreate`、没有 `Python 资源解包完成` → 崩在解包；
            - 有 `即将调用 QtActivity.super.onCreate`、没有 `已返回` → 崩在 Qt 平台插件 / libmain；
            - `PythonActivity.super.onCreate 已返回` 但应用没界面 → 崩在 Python 启动，看随附的 Python 日志。

            4. 再装 `HelloQt-*.apk` 做对照：
               - 能正常显示「Hello FrogLog」→ 是 FrogLog 应用代码的问题；
               - 同样闪退 → 是 Qt/PySide6/NDK 打包链路的问题。
          files: dist/*.apk
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
